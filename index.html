<title>FrigLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EFF4F5;
    --surface:#FFFFFF;
    --surface-2:#E4ECED;
    --text:#0F1E20;
    --text-2:#57696C;
    --border:#D3DEE0;
    --accent:#0C7C86;
    --accent-strong:#095F67;
    --accent-tint:#DCEFF0;
    --warning:#A6690F;
    --warning-tint:#F6E6D2;
    --danger:#B3261E;
    --danger-tint:#F7DEDC;
    --success:#1F7A4D;
    --success-tint:#DCEFE3;
    --orange:#B85C00;
    --orange-tint:#F8E4CC;
    --yellow:#8A6D00;
    --yellow-tint:#F7F0CC;
    --focus:#0C7C86;
    --shadow:0 1px 2px rgba(15,30,32,.06), 0 8px 24px -12px rgba(15,30,32,.18);
    --radius-s:6px;
    --radius-m:10px;
    --radius-l:16px;
    --font-scale:1;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0B1516;
      --surface:#101E20;
      --surface-2:#16282B;
      --text:#E7F1F1;
      --text-2:#93A9AC;
      --border:#223638;
      --accent:#34AEB8;
      --accent-strong:#5EC4CD;
      --accent-tint:#123236;
      --warning:#D99A3F;
      --warning-tint:#2E230F;
      --danger:#E5837C;
      --danger-tint:#341715;
      --success:#5CBE8B;
      --success-tint:#122A1E;
      --orange:#E8974A;
      --orange-tint:#332310;
      --yellow:#D9C24A;
      --yellow-tint:#2E2A10;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0B1516;
    --surface:#101E20;
    --surface-2:#16282B;
    --text:#E7F1F1;
    --text-2:#93A9AC;
    --border:#223638;
    --accent:#34AEB8;
    --accent-strong:#5EC4CD;
    --accent-tint:#123236;
    --warning:#D99A3F;
    --warning-tint:#2E230F;
    --danger:#E5837C;
    --danger-tint:#341715;
    --success:#5CBE8B;
    --success-tint:#122A1E;
    --orange:#E8974A;
    --orange-tint:#332310;
    --yellow:#D9C24A;
    --yellow-tint:#2E2A10;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
  }
  :root[data-contrast="high"]{
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --surface-2:#EDEDED;
    --text:#000000;
    --text-2:#1A1A1A;
    --border:#000000;
    --accent:#00494F;
    --accent-strong:#00363A;
    --accent-tint:#D6E9EA;
  }
  :root[data-theme="dark"][data-contrast="high"]{
    --bg:#000000;
    --surface:#000000;
    --surface-2:#151515;
    --text:#FFFFFF;
    --text-2:#F2F2F2;
    --border:#FFFFFF;
    --accent:#8FE3E9;
    --accent-strong:#C4F3F6;
    --accent-tint:#0F2C2E;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html{font-size:calc(16px * var(--font-scale));}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Inter",system-ui,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  [data-motion="reduced"] *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

  h1,h2,h3,h4{font-family:"Archivo",system-ui,sans-serif; font-weight:700; text-wrap:balance; margin:0; color:var(--text);}
  p{margin:0; text-align:justify;}
  a{color:inherit;}
  button, input, select, textarea{font:inherit; color:inherit;}
  button{cursor:pointer;}
  :focus-visible{outline:2.5px solid var(--focus); outline-offset:2px; border-radius:4px;}
  .mono{font-family:"IBM Plex Mono","SFMono-Regular",monospace;}
  .visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap;}

  /* ---------- Shell ---------- */
  #app{min-height:100vh; display:flex; flex-direction:column;}
  body{overflow-x:hidden;}
  .topbar{
    display:flex; align-items:center; gap:16px;
    padding:14px 28px; background:var(--surface); border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:20;
  }
  .brand{display:flex; align-items:center; gap:10px; font-family:"Archivo"; font-weight:800; font-size:1.15rem; letter-spacing:-.01em; flex:none; white-space:nowrap; cursor:pointer; border-radius:var(--radius-s);}
  .brand:hover{opacity:.85;}
  .brand:focus-visible{outline:2.5px solid var(--focus); outline-offset:3px;}
  .brand .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(155deg,var(--accent),var(--accent-strong));display:flex;align-items:center;justify-content:center;color:#fff;font-size:1rem;flex:none;}
  .brand small{display:block;font-family:"Inter";font-weight:500;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2);}
  .nav-links{display:flex; gap:4px; flex:1 1 auto; min-width:0; overflow-x:auto; scrollbar-width:thin;}
  .nav-links button{
    background:none;border:none;padding:8px 14px;border-radius:var(--radius-s);
    font-weight:600;font-size:.92rem;color:var(--text-2); white-space:nowrap; flex:none;
  }
  .nav-links button:hover{background:var(--surface-2); color:var(--text);}
  .nav-links button.active{background:var(--accent-tint); color:var(--accent-strong);}
  .topbar-right{display:flex; align-items:center; gap:10px; flex:none;}
  .icon-btn{
    width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--surface);
    display:flex;align-items:center;justify-content:center;font-size:1.05rem; flex:none;
  }
  .icon-btn:hover{background:var(--surface-2);}
  .user-chip{display:flex; align-items:center; gap:8px; padding:5px 12px 5px 5px; border-radius:999px; border:1px solid var(--border); background:var(--surface); white-space:nowrap;}
  .avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;flex:none;}
  .user-chip .who{text-align:left;}
  .user-chip .who b{display:block;font-size:.8rem;line-height:1.1;}
  .user-chip .who span{display:block;font-size:.68rem;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em;}
  @media (max-width:720px){
    .topbar{padding:10px 14px; gap:10px;}
    .brand small, .user-chip .who span{display:none;}
    .brand{font-size:1rem;}
    .nav-links button{padding:7px 10px; font-size:.84rem;}
    .user-chip .who b{font-size:.76rem;}
  }
  .user-menu-wrap{position:relative;}
  .user-menu{
    position:absolute; right:0; top:calc(100% + 8px); background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-m); box-shadow:var(--shadow); min-width:200px; padding:6px; z-index:30;
  }
  .user-menu button{width:100%; text-align:left; padding:9px 12px; border-radius:var(--radius-s); background:none; border:none; font-size:.88rem; font-weight:600;}
  .user-menu button:hover{background:var(--surface-2);}
  .user-menu button.danger{color:var(--danger);}
  .user-menu hr{border:none; border-top:1px solid var(--border); margin:6px 2px;}

  .notif-wrap{position:relative;}
  .notif-panel{
    position:absolute; right:0; top:calc(100% + 8px); background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-m); box-shadow:var(--shadow); width:340px; max-height:400px; overflow-y:auto; z-index:30;
  }
  .notif-panel h4{padding:14px 16px 10px; font-size:.9rem; border-bottom:1px solid var(--border); margin:0;}
  .notif-item{display:block; width:100%; text-align:left; padding:12px 16px; background:none; border:none; border-bottom:1px solid var(--border); cursor:pointer;}
  .notif-item:last-child{border-bottom:none;}
  .notif-item:hover{background:var(--surface-2);}
  .notif-item .notif-top{display:flex; justify-content:space-between; gap:8px; margin-bottom:4px;}
  .notif-item .notif-order{font-size:.78rem; font-weight:700; color:var(--accent-strong);}
  .notif-tipo{display:inline-block; font-size:.62rem; font-weight:800; text-transform:uppercase; letter-spacing:.04em; padding:2px 7px; border-radius:999px; margin-right:6px; vertical-align:middle;}
  .notif-tipo-pedido{background:var(--accent-tint); color:var(--accent-strong);}
  .notif-tipo-orcamento{background:var(--warning-tint); color:var(--warning);}
  .notif-item .notif-date{font-size:.7rem; color:var(--text-2); white-space:nowrap;}
  .notif-item .notif-from{font-size:.72rem; color:var(--text-2); margin-bottom:2px;}
  .notif-item .notif-text{font-size:.85rem; color:var(--text); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .notif-empty{padding:24px 16px; text-align:center; font-size:.85rem; color:var(--text-2);}

  .search-wrap{position:relative;}
  .search-panel{
    position:absolute; right:0; top:calc(100% + 8px); background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-m); box-shadow:var(--shadow); width:280px; padding:14px; z-index:30;
  }
  .search-panel form{display:flex; gap:8px;}
  .search-panel input{flex:1; background:var(--bg); color:var(--text); border:1.5px solid var(--border); border-radius:var(--radius-s); padding:9px 11px; font-size:.88rem;}
  .search-panel input:focus{border-color:var(--accent);}
  .search-active-note{display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--accent-tint); color:var(--accent-strong); border-radius:var(--radius-s); padding:10px 14px; font-size:.86rem; margin-bottom:20px;}
  .search-active-note button{background:none; border:none; color:var(--accent-strong); font-weight:700; text-decoration:underline; cursor:pointer; padding:0;}
  .date-filter{display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-s); padding:14px 16px; margin-bottom:20px;}
  .date-filter label{display:flex; flex-direction:column; gap:4px; font-size:.78rem; color:var(--text-2); font-weight:600;}
  .date-filter input{background:var(--bg); color:var(--text); border:1.5px solid var(--border); border-radius:var(--radius-s); padding:8px 10px; font-size:.86rem;}
  .date-filter input:focus{border-color:var(--accent);}

  main{flex:1; width:100%;}
  .page{max-width:1180px; margin:0 auto; padding:40px 28px 80px;}
  .page-head{margin-bottom:28px; display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .page-head h1{font-size:1.7rem;}
  .page-head p{color:var(--text-2); margin-top:4px; max-width:60ch;}
  .eyebrow{font-size:.72rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--accent-strong); margin-bottom:6px; display:block;}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:11px 20px; border-radius:var(--radius-s); border:1.5px solid transparent;
    font-weight:600; font-size:.92rem; white-space:nowrap;
  }
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-primary:hover{background:var(--accent-strong);}
  .btn-primary:disabled{background:var(--surface-2); color:var(--text-2); cursor:not-allowed;}
  .btn-secondary{background:var(--surface); border-color:var(--border); color:var(--text);}
  .btn-secondary:hover{background:var(--surface-2);}
  .btn-danger{background:var(--danger); color:#fff;}
  .btn-danger:hover{filter:brightness(1.08);}
  .btn-ghost{background:none; border-color:transparent; color:var(--accent-strong); padding:8px 6px;}
  .btn-ghost:hover{text-decoration:underline;}
  .btn-block{width:100%;}
  .btn-sm{padding:7px 12px; font-size:.8rem;}

  /* ---------- Forms ---------- */
  .field{display:flex; flex-direction:column; gap:6px; margin-bottom:16px;}
  .field label{font-size:.82rem; font-weight:600;}
  .field input, .field select, .field textarea{
    border:1.5px solid var(--border); border-radius:var(--radius-s); padding:11px 13px;
    background:var(--surface); color:var(--text); font-size:.92rem;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent);}
  .field .hint{font-size:.76rem; color:var(--text-2);}
  .field .error{font-size:.78rem; color:var(--danger); font-weight:600;}
  .field.has-error input{border-color:var(--danger);}

  /* ---------- Ficha técnica ---------- */
  .ficha-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:14px 16px;}
  .ficha-grid .field{margin-bottom:0;}
  .ficha-section-title{font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-2); margin:18px 0 10px; padding-top:14px; border-top:1px solid var(--border);}
  .ficha-section-title:first-child{margin-top:0; padding-top:0; border-top:none;}
  .ficha-view dl{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px 20px; margin:0;}
  .ficha-view dt{font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; color:var(--text-2); margin-bottom:2px;}
  .ficha-view dd{margin:0; font-size:.92rem; font-weight:600;}
  .ficha-view .ficha-info{margin-top:16px; padding-top:14px; border-top:1px solid var(--border);}
  .ficha-view .ficha-info dd{font-weight:400; white-space:pre-wrap; line-height:1.5;}
  .checkbox-row{display:flex; align-items:flex-start; gap:10px;}
  .checkbox-row input{width:19px;height:19px;margin-top:2px;accent-color:var(--accent);flex:none;}
  .terms-details{border:1px solid var(--border); border-radius:var(--radius-m); padding:10px 14px; margin-bottom:14px; background:var(--bg-2,transparent);}
  .terms-details summary{cursor:pointer; font-size:.86rem; font-weight:600; color:var(--accent-strong);}
  .terms-details .terms-body{margin-top:10px; max-height:220px; overflow-y:auto; font-size:.82rem; color:var(--text-2); display:flex; flex-direction:column; gap:8px;}
  .terms-details .terms-body h5{color:var(--text); font-size:.82rem;}

  /* ---------- Cards & surfaces ---------- */
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l); box-shadow:var(--shadow);}
  .auth-shell{min-height:100vh; display:grid; grid-template-columns:1.1fr 1fr;}
  @media (max-width:860px){.auth-shell{grid-template-columns:1fr;}}
  .auth-brand{
    background:linear-gradient(165deg,var(--accent-strong),var(--accent) 60%, #0A4147);
    color:#F3FBFB; padding:52px; display:flex; flex-direction:column; justify-content:space-between;
  }
  @media (max-width:860px){.auth-brand{display:none;}}
  .auth-brand h2{color:#fff; font-size:1.9rem; max-width:16ch;}
  .auth-brand .spec-list{display:flex; flex-direction:column; gap:14px; margin-top:10px;}
  .auth-brand .spec-list div{display:flex; gap:10px; align-items:baseline; font-size:.88rem; color:#DCF3F3;}
  .auth-brand .spec-list b{font-family:"IBM Plex Mono"; color:#fff; font-size:.82rem;}
  .auth-form-wrap{display:flex; align-items:center; justify-content:center; padding:40px 24px;}
  .auth-form{width:100%; max-width:380px;}
  .auth-form h1{font-size:1.5rem; margin-bottom:6px;}
  .auth-form>p.sub{color:var(--text-2); margin-bottom:26px; font-size:.9rem;}
  .demo-hint{background:var(--accent-tint); border:1px dashed var(--accent); border-radius:var(--radius-s); padding:10px 12px; font-size:.78rem; color:var(--accent-strong); margin-bottom:20px;}

  .grid-products{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:20px;}
  .product-card{padding:0; display:flex; flex-direction:column; overflow:hidden;}
  .product-card .thumb{width:100%; aspect-ratio:4/3; object-fit:cover; display:block; background:var(--surface-2); border-bottom:1px solid var(--border);}
  .product-card .body{padding:16px 18px 18px; display:flex; flex-direction:column; gap:4px; flex:1;}
  .product-card .cat{font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--accent-strong);}
  .product-card h3{font-size:1.08rem; margin-top:1px;}
  .product-card .sku{font-size:.72rem; color:var(--text-2); margin-bottom:10px;}
  .product-card .desc{font-size:.84rem; color:var(--text-2); flex:1;}
  .specs{display:flex; flex-direction:column; gap:6px; font-size:.78rem; padding:12px; background:var(--surface-2); border-radius:var(--radius-s);}
  .specs div{display:flex; justify-content:space-between; gap:10px;}
  .specs span:first-child{color:var(--text-2);}
  .specs b{font-family:"IBM Plex Mono"; font-weight:600;}
  .price{font-family:"IBM Plex Mono"; font-weight:600; font-size:1.05rem; color:var(--text);}

  .badge{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px; font-size:.72rem; font-weight:700; letter-spacing:.02em;}
  .badge::before{content:""; width:6px;height:6px;border-radius:50%;background:currentColor;}
  .badge-pending{background:var(--warning-tint); color:var(--warning);}
  .badge-success{background:var(--success-tint); color:var(--success);}
  .badge-danger{background:var(--danger-tint); color:var(--danger);}
  .badge-neutral{background:var(--surface-2); color:var(--text-2);}
  .badge-accent{background:var(--accent-tint); color:var(--accent-strong);}
  .badge-orange{background:var(--orange-tint); color:var(--orange);}
  .badge-yellow{background:var(--yellow-tint); color:var(--yellow);}

  .nav-badge{display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:18px; padding:0 5px; border-radius:999px; background:var(--danger); color:#fff; font-size:.68rem; font-weight:800; margin-left:4px; vertical-align:middle;}
  .bell-btn{position:relative;}
  .bell-dot{position:absolute; top:5px; right:5px; min-width:16px; height:16px; padding:0 4px; border-radius:999px; background:var(--danger); color:#fff; font-size:.62rem; font-weight:800; display:flex; align-items:center; justify-content:center; border:2px solid var(--surface);}
  .row-unread{position:relative;}
  .row-unread td:first-child{box-shadow:inset 3px 0 0 var(--accent);}
  .row-unread-badge{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;font-weight:700;color:var(--accent-strong);background:var(--accent-tint);padding:2px 8px;border-radius:999px;margin-left:8px;}

  table{width:100%; border-collapse:collapse; font-size:.86rem;}
  th{text-align:left; font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text-2); padding:16px 14px; font-weight:700; vertical-align:middle;}
  td{padding:13px 14px; border-top:1px solid var(--border);}
  tr:hover td{background:var(--surface-2);}
  .table-wrap{overflow-x:auto; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l); box-shadow:var(--shadow);}
  .table-actions{display:flex; gap:8px; flex-wrap:wrap;}

  /* ---------- Chat ---------- */
  .chat-shell{display:grid; grid-template-columns:1fr 320px; gap:24px; align-items:start;}
  @media (max-width:900px){.chat-shell{grid-template-columns:1fr;}}
  .chat-window{display:flex; flex-direction:column; height:min(640px,72vh);}
  .chat-log{flex:1; overflow-y:auto; padding:22px; display:flex; flex-direction:column; gap:14px;}
  .msg{max-width:78%; padding:11px 15px; border-radius:14px; font-size:.9rem; line-height:1.45;}
  .msg-bot{align-self:flex-start; background:var(--surface-2); border-bottom-left-radius:4px;}
  .msg-user{align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px;}
  .msg-quote{align-self:flex-start; background:var(--surface); border:1.5px solid var(--accent); border-radius:14px; padding:16px; max-width:88%;}
  .typing{align-self:flex-start; display:flex; gap:4px; padding:12px 15px;}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--text-2);animation:blink 1.2s infinite;}
  .typing span:nth-child(2){animation-delay:.2s;} .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}
  .chat-input{display:flex; gap:10px; padding:16px; border-top:1px solid var(--border);}
  .chat-input input, .chat-input select{
    flex:1; background:var(--surface); color:var(--text); border:1.5px solid var(--border);
    border-radius:var(--radius-s); padding:11px 13px; font-size:.92rem;
  }
  .chat-input input:focus, .chat-input select:focus{border-color:var(--accent);}
  .chat-input input::placeholder{color:var(--text-2);}
  .chat-attach-btn{flex:none; width:42px; height:42px; border-radius:var(--radius-s); border:1.5px solid var(--border);
    background:var(--surface); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:1.6rem; font-weight:500; line-height:1; color:var(--text-2);}
  .chat-attach-btn:hover{border-color:var(--accent); color:var(--accent-strong);}

          informacoes:"Porta toda revestida em alumínio xadrez. Alavanca externa e interna fermood. 02 blocos de fechamento (em cima / em baixo). 04 dobradiças. Aquecimento separado folha / batente / soleira."},

      { id:"q_demo3", numero:"ORC-0003", clientId:"u_demo_cliente", productId:"d_emergencia", quantidade:1, aplicacao:"Saída de emergência em câmara fria de laticínios", valor:3328, status:"encaminhado_representante", createdAt:"2026-08-29T09:00:00", chat:[
        {from:"cliente", texto:"Essa porta de emergência atende a norma de saída para câmaras frigoríficas?", ts:"2026-08-29T09:30:00"}

      { id:"q_demo4", numero:"ORC-0004", clientId:"u_demo_cliente", productId:"pn_eps", quantidade:60, aplicacao:"Vedação de câmara fria em obra nova de distribuidora", valor:19968, status:"convertido", createdAt:"2026-08-20T11:00:00" },
      { id:"q_demo5", numero:"ORC-0005", clientId:"u_demo_cliente", productId:"tl_eps", quantidade:45, aplicacao:"Cobertura de galpão frigorífico", valor:13338, status:"convertido", createdAt:"2026-08-15T16:00:00" },

  function loadDb(){
    try{
      const raw = localStorage.getItem(DB_KEY);
      if(!raw) { const s = seedDb(); saveDb(s); return s; }
      const parsed = JSON.parse(raw);
      migrateDb(parsed);
      return parsed;
    }catch(e){ const s = seedDb(); saveDb(s); return s; }
  }
  function migrateDb(dbObj){
    let changed = false;
    if(!dbObj.users.some(u => u.id === "u_demo_cliente")){
      dbObj.users.push({ id:"u_demo_cliente", nome:"Cliente Demonstração", email:"cliente@friglab.com", senha:"cliente123", role:"cliente" });
      changed = true;
    }
    // Reset do catalogo de produtos (versao antiga usava produtos ficticios genericos)
    if(!dbObj.products.some(p => p.id === "d_vaivem")){
      dbObj.products = seedProducts();
      dbObj.quotes = seedQuotes();
      dbObj.orders = seedOrders();
      dbObj.seq.quote = 7;
      dbObj.seq.order = 4;
      changed = true;
    }
    // Remove Painel/Telha PIR do catalogo (PIR passou a ser so uma opcao de nucleo isolante nas portas)
    if(dbObj.products.some(p => p.id === "pn_pir" || p.id === "tl_pir")){
      dbObj.products = seedProducts();
      dbObj.quotes.forEach(q => {
        if(q.productId === "pn_pir") q.productId = "pn_eps";
        if(q.productId === "tl_pir") q.productId = "tl_eps";
      });
      changed = true;
    }
    if(!dbObj.quotes.some(q => q.id === "q_demo1")){
      dbObj.quotes.push(...seedQuotes());
      dbObj.orders.push(...seedOrders());
      dbObj.seq.quote = Math.max(dbObj.seq.quote, 7);
      dbObj.seq.order = Math.max(dbObj.seq.order, 4);
      changed = true;
    }
    dbObj.products.forEach(p => {
      if(!p.imagem){ p.imagem = PRODUCT_ART[p.id] || genericArt(); changed = true; }
    });
    dbObj.orders.forEach(o => {
      if(!o.chat){ o.chat = []; changed = true; }
      if(!o.previsaoEntrega){
        const q = dbObj.quotes.find(x=>x.id===o.quoteId);
        const prod = q ? dbObj.products.find(p=>p.id===q.productId) : null;
        o.previsaoEntrega = addDays(o.createdAt, prazoEntregaDias(prod && prod.categoria));
        changed = true;
      }
    });
    dbObj.quotes.forEach(q => {
      if(!q.chat){ q.chat = []; changed = true; }
    });
    if(changed) saveDb(dbObj);
  }
  function saveDb(db){ try{ localStorage.setItem(DB_KEY, JSON.stringify(db)); return true; }catch(e){ return false; } }

  /* Redimensiona/comprime uma imagem enviada pelo admin antes de guardar (mantém o localStorage leve) */
  const CHAT_FILE_MAX = 1.5 * 1024 * 1024;

    ["threadChatImage","threadChatFileName","threadChatFileType","threadChatFile"].forEach(id=>{ const el = document.getElementById(id); if(el) el.value = ""; });
    const prev = document.getElementById("threadChatPreview");
    if(prev){ prev.hidden = true; prev.innerHTML = ""; }
  }
  function resizeImageFile(file, maxW, cb){
    const reader = new FileReader();
    reader.onload = function(ev){
      const img = new Image();
      img.onload = function(){
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        cb(canvas.toDataURL("image/jpeg", 0.82));
      };
      img.onerror = function(){ showToast("Não foi possível ler essa imagem."); };
      img.src = ev.target.result;
    };
    reader.onerror = function(){ showToast("Não foi possível ler esse arquivo."); };
    reader.readAsDataURL(file);
  }

  let db = loadDb();

  function getSession(){
    try{ return JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); }catch(e){ return null; }
  }
  let sessionTermsAck = false;
  function setSession(s){
    if(s){ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); sessionTermsAck = false; }
    else localStorage.removeItem(SESSION_KEY);
  }
  function currentUser(){
    const s = getSession();
    if(!s) return null;
    return db.users.find(u => u.id === s.userId) || null;
  }

  /* ===================== A11y state ===================== */
  function loadA11y(){
    try{ return Object.assign({fontScale:1, highContrast:false, reduceMotion:false}, JSON.parse(localStorage.getItem(A11Y_KEY) || "{}")); }
    catch(e){ return {fontScale:1, highContrast:false, reduceMotion:false}; }
  }
  let a11y = loadA11y();
  function saveA11y(){ localStorage.setItem(A11Y_KEY, JSON.stringify(a11y)); applyA11y(); }
  function applyA11y(){
    document.documentElement.style.setProperty("--font-scale", a11y.fontScale);
    document.documentElement.setAttribute("data-contrast", a11y.highContrast ? "high" : "normal");
    document.documentElement.setAttribute("data-motion", a11y.reduceMotion ? "reduced" : "normal");
  }
  applyA11y();

  /* ===================== Helpers ===================== */
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function brl(n){ return new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(n); }
  function initials(name){ return (name||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase(); }
  function uid(prefix){ return prefix + "_" + Math.random().toString(36).slice(2,9); }
  function go(hash){ location.hash = hash; }
  function showToast(msg){
    const el = document.createElement("div");
    el.className = "toast"; el.setAttribute("role","status"); el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 2600);
  }
  function fmtDate(iso){ return new Intl.DateTimeFormat("pt-BR",{dateStyle:"short", timeStyle:"short"}).format(new Date(iso)); }
  function fmtDateOnly(iso){ return new Intl.DateTimeFormat("pt-BR",{dateStyle:"long"}).format(new Date(iso)); }
  function addDays(iso, days){ const d = new Date(iso); d.setDate(d.getDate()+days); return d.toISOString(); }
  /* Prazo estimado de fabricação/entrega por categoria de produto (dias corridos a partir da confirmação do pedido) */
  function prazoEntregaDias(categoria){
    const c = (categoria || "").toLowerCase();
    if(c.includes("painel") || c.includes("telha")) return 20;
    if(c.includes("porta")) return 15;
    return 18;
  }

    atendido_representante: {label:"Atendido por representante", cls:"badge-success"},

  const ORDER_STATUS_BADGE_CLASS = {

    entregue: "badge-success"

  /* Alerta de mensagem nova no chat do pedido */
  function hasUnreadThread(entity, role){
    const chat = entity.chat || [];
    if(!chat.length) return false;
    const last = chat[chat.length-1];
    const fromOther = role === "admin" ? last.from === "cliente" : last.from === "admin";
    if(!fromOther) return false;
    const seen = entity.lastSeen && entity.lastSeen[role];
    if(!seen) return true;
    return new Date(last.ts).getTime() > new Date(seen).getTime();
  }
  function unreadCountByType(user, type){
    if(!user) return 0;
    const role = user.role === "admin" ? "admin" : "cliente";
    if(type === "pedido"){
      const myOrders = user.role === "admin" ? db.orders : db.orders.filter(o => o.clientId === user.id);
      return myOrders.filter(o => hasUnreadThread(o, role)).length;
    }
    const myQuotes = user.role === "admin" ? db.quotes : db.quotes.filter(q => q.clientId === user.id);
    return myQuotes.filter(q => hasUnreadThread(q, role)).length;
  }
  function unreadCount(user){
    return unreadCountByType(user, "pedido") + unreadCountByType(user, "orcamento");
  }
  function unreadNotifications(user){
    if(!user) return [];
    const role = user.role === "admin" ? "admin" : "cliente";
    const myOrders = user.role === "admin" ? db.orders : db.orders.filter(o => o.clientId === user.id);
    const myQuotes = user.role === "admin" ? db.quotes : db.quotes.filter(q => q.clientId === user.id);
    const fromOrders = myOrders.filter(o => hasUnreadThread(o, role)).map(o => {
      const last = o.chat[o.chat.length - 1];
      const q = getQuote(o.quoteId); const p = q ? getProduct(q.productId) : null;
      const cl = role === "admin" ? db.users.find(u => u.id === o.clientId) : null;
      return {
        tipo: "Pedido", href: `#/pedido/${o.id}`, numero: o.numero,
        produto: p ? p.nome : "",
        from: role === "admin" ? (cl ? cl.nome : "Cliente") : "Equipe FrigLab",
        texto: last.texto, ts: last.ts
      };
    });
    const fromQuotes = myQuotes.filter(q => hasUnreadThread(q, role)).map(q => {
      const last = q.chat[q.chat.length - 1];
      const p = getProduct(q.productId);
      const cl = role === "admin" ? db.users.find(u => u.id === q.clientId) : null;
      return {
        tipo: "Orçamento", href: `#/orcamento/${q.id}`, numero: q.numero,
        produto: p ? p.nome : "",
        from: role === "admin" ? (cl ? cl.nome : "Cliente") : "Equipe FrigLab",
        texto: last.texto, ts: last.ts
      };
    });
    return [...fromOrders, ...fromQuotes].sort((a,b)=> new Date(b.ts) - new Date(a.ts));
  }
  function markThreadSeen(entity, role){
    entity.lastSeen = entity.lastSeen || {};
    entity.lastSeen[role] = new Date().toISOString();
    saveDb(db);
  }
  /* ===================== Router ===================== */
  const PUBLIC_ROUTES = ["#/login","#/cadastro"];
  const GUEST_OK_PREFIXES = ["#/catalogo", "#/produto/"];
  const ADMIN_ROUTES = ["#/admin/catalogo","#/admin/orcamentos","#/admin/pedidos"];

  function currentRoute(){ return location.hash || "#/"; }
  function isGuestOk(route){ return route === "#/" || GUEST_OK_PREFIXES.some(p => route === p || route.startsWith(p)); }

  function guard(){
    const route = currentRoute().split("?")[0];
    const user = currentUser();
    if(!user){
      if(PUBLIC_ROUTES.includes(route) || isGuestOk(route)) return true;
      go("#/login");
      return false;
    }
    if(!sessionTermsAck && route !== "#/aceitar-termos"){ go("#/aceitar-termos"); return false; }
    if(sessionTermsAck && route === "#/aceitar-termos"){ go(user.role==="admin" ? "#/admin/catalogo" : "#/catalogo"); return false; }
    if(PUBLIC_ROUTES.includes(route)){ go(user.role==="admin" ? "#/admin/catalogo" : "#/catalogo"); return false; }
    if(user.role!=="admin" && ADMIN_ROUTES.includes(route)){ go("#/catalogo"); return false; }
    const isOrcamentoDetail = route.startsWith("#/orcamento/") && !route.startsWith("#/orcamento/chat");
    if(user.role==="admin" && route!=="#/" && route!=="#/aceitar-termos" && !ADMIN_ROUTES.includes(route) && !route.startsWith("#/pedido/") && !isOrcamentoDetail){ go("#/admin/catalogo"); return false; }
    return true;
  }

  window.addEventListener("hashchange", render);
  window.addEventListener("DOMContentLoaded", render);

  function render(){
    if(!guard()) return;
    const [fullPath, query] = currentRoute().slice(2).split("?");
    const parts = fullPath.split("/");
    const path = parts[0];
    const app = document.getElementById("app");
    let html = "";
    const user = currentUser();

    if(path === "") html = user ? withShell(viewHome(), user, "home") : withPublicShell(viewHome(), "home");
    else if(path === "login") html = viewLogin();
    else if(path === "cadastro") html = viewCadastro();
    else if(path === "aceitar-termos") html = viewAceitarTermos();
    else if(path === "catalogo") html = user ? withShell(viewCatalogo(), user, "catalogo") : withPublicShell(viewCatalogo(), "catalogo");
    else if(path === "produto" && parts[1]) html = user ? withShell(viewProdutoDetalhe(parts[1]), user, "catalogo") : withPublicShell(viewProdutoDetalhe(parts[1]), "catalogo");
    else if(path === "orcamento" && parts[1] === "chat") html = withShell(viewChat(), user, "orcamentos");
    else if(path === "orcamento" && parts[1]) html = withShell(viewOrcamentoResumo(parts[1]), user, "orcamentos");
    else if(path === "meus-orcamentos") html = withShell(viewMeusOrcamentos(user), user, "orcamentos");
    else if(path === "pagamento" && parts[1]) html = withShell(viewPagamento(parts[1]), user, "orcamentos");
    else if(path === "confirmacao" && parts[1]) html = withShell(viewConfirmacao(parts[1]), user, "pedidos");
    else if(path === "meus-pedidos") html = withShell(viewMeusPedidos(user), user, "pedidos");
    else if(path === "pedido" && parts[1]) html = withShell(viewPedidoDetalhe(parts[1]), user, (user && user.role==="admin") ? "admin-pedidos" : "pedidos");
    else if(path === "admin" && parts[1] === "catalogo") html = withShell(viewAdminCatalogo(), user, "admin-catalogo");
    else if(path === "admin" && parts[1] === "orcamentos") html = withShell(viewAdminOrcamentos(), user, "admin-orcamentos");
    else if(path === "admin" && parts[1] === "pedidos") html = withShell(viewAdminPedidos(), user, "admin-pedidos");
    else { go(user ? (user.role==="admin" ? "#/admin/catalogo" : "#/catalogo") : "#/"); return; }

    app.innerHTML = html + a11yWidget();
    initA11yWidget();
    afterRender(path, parts);
    window.scrollTo(0,0);
  }

  function withShell(contentHtml, user, activeKey){
    const isAdmin = user && user.role === "admin";

      {key:"orcamentos", label:"Meus orçamentos", href:"#/meus-orcamentos"},

    const unreadPedidos = unreadCountByType(user, "pedido");

    const e = f.querySelector(".error");
    e.textContent = msg; e.hidden = false;
    const i = f.querySelector("input");
    if(i) i.setAttribute("aria-invalid","true");

  function clearErrors(formEl){
    formEl.querySelectorAll(".field").forEach(f=>{ f.classList.remove("has-error"); const e=f.querySelector(".error"); if(e){e.hidden=true;e.textContent="";} });
  }

  function searchQueryFromUrl(){
    const qs = currentRoute().split("?")[1] || "";
    return new URLSearchParams(qs).get("q") || "";

  function filterProducts(list, q){
    if(!q) return list;
    const needle = q.toLowerCase();
    return list.filter(p => `${p.nome} ${p.categoria} ${p.sku}`.toLowerCase().includes(needle));
  }
  function searchActiveNoteHtml(q, clearHref){
    if(!q) return "";
    return `<div class="search-active-note">Mostrando resultados para "<b>${esc(q)}</b>" <button data-nav="${clearHref}">Limpar busca</button></div>`;
  }

  /* ---- Filtro por período (usado nas listagens de orçamentos e pedidos) ---- */
  function dateRangeFromUrl(){
    const qs = currentRoute().split("?")[1] || "";
    const p = new URLSearchParams(qs);
    return { de: p.get("de") || "", ate: p.get("ate") || "", ord: p.get("ord") === "asc" ? "asc" : "desc" };
  }
  function filterByDateRange(list, de, ate, dateField){
    if(!de && !ate) return list;
    return list.filter(item=>{
      const d = (item[dateField] || "").slice(0,10);
      if(de && d < de) return false;
      if(ate && d > ate) return false;
      return true;
    });
  }
  function sortByDateOrder(list, ord, dateField){
    return [...list].sort((a,b)=> ord === "asc" ? a[dateField].localeCompare(b[dateField]) : b[dateField].localeCompare(a[dateField]));
  }
  function dateFilterHtml(de, ate, baseHref, ord){
    ord = ord === "asc" ? "asc" : "desc";
    const hasFilter = de || ate || ord === "asc";
    return `
      <form class="date-filter" id="dateFilterForm" data-base="${baseHref}">
        <label>De<input type="date" id="dfDe" value="${esc(de)}"></label>
        <label>Até<input type="date" id="dfAte" value="${esc(ate)}"></label>
        <label>Ordenar por
          <select id="dfOrd">
            <option value="desc" ${ord==="desc"?"selected":""}>Mais recente</option>
            <option value="asc" ${ord==="asc"?"selected":""}>Mais antigo</option>
          </select>
        </label>
        <button type="submit" class="btn btn-secondary btn-sm">Filtrar</button>
        ${hasFilter ? `<button type="button" class="btn btn-ghost btn-sm" data-nav="${baseHref}">Limpar filtro</button>` : ""}
      </form>
    `;
  }

  /* ===================== Views: Chat / IA ===================== */
  let chatState = null;
  let pendingQuoteProductId = null;
  function goAfterLogin(user){
    if(pendingQuoteProductId){
      const pid = pendingQuoteProductId;
      pendingQuoteProductId = null;
      chatState = null;
      go("#/orcamento/chat?produto="+pid);
      return;
    }
    go(user.role==="admin" ? "#/admin/catalogo" : "#/catalogo");
  }
  function resetChat(productId){
    const product = db.products.find(p=>p.id===productId) || db.products[0];
    chatState = { product, step:"quantidade", quantidade:null, aplicacao:null, log:[
      {who:"bot", text:`Olá! Sou o assistente de orçamentos da FrigLab 🤖. Vi que você tem interesse em ${product.nome}. Para montar sua estimativa, preciso de alguns detalhes.`},
      {who:"bot", text: unidadeLabel(product) }
    ]};
  }
  function unidadeLabel(p){
    return p.unidade === "m²" ? `Qual a área aproximada, em m²?` : `Qual a quantidade necessária (em ${p.unidade}s)?`;
  }

  function viewChat(){
    if(!chatState){
      const params = new URLSearchParams(currentRoute().split("?")[1]||"");
      resetChat(params.get("produto"));
    }
    const st = chatState;
    return `
      <div class="page-head"><div><span class="eyebrow">Assistente de IA</span><h1>Solicitação de orçamento</h1><p>Converse com o assistente para gerar uma estimativa para ${esc(st.product.nome)}.</p></div>
      <button class="btn btn-secondary" data-nav="#/catalogo">← Voltar ao catálogo</button></div>
      <div class="chat-shell">
        <div class="card chat-window">
          <div class="chat-log" id="chatLog">
            ${st.log.map(renderMsg).join("")}
          </div>
          ${chatInputArea()}
        </div>
        <div class="card side-note">
          <h4>Produto selecionado</h4>
          <div class="specs">
            <div><span>Produto</span><b>${esc(st.product.nome)}</b></div>
            <div><span>Preço base</span><b>${brl(st.product.precoBase)} / ${esc(st.product.unidade)}</b></div>
            <div><span>Faixa de temperatura</span><b>${esc(st.product.faixaTemp)}</b></div>
          </div>
          <h4>Como funciona</h4>
          <p>O assistente estrutura sua conversa em três etapas: produto, dimensionamento e aplicação. Se faltar informação, ele pede um complemento antes de calcular — assim como no fluxo documentado do projeto.</p>
        </div>
      </div>
    `;
  }
  function renderMsg(m){
    if(m.who === "quote") return `<div class="msg-quote">${m.html}</div>`;
    return `<div class="msg ${m.who==='bot'?'msg-bot':'msg-user'}">${esc(m.text)}</div>`;
  }
  function chatInputArea(){
    const st = chatState;
    if(st.step === "quantidade"){
      return `<div class="chips">${[1,2,5,10].map(n=>`<button class="chip" data-action="chat-qtd" data-v="${n}">${n} ${st.product.unidade}${n>1?"s":""}</button>`).join("")}</div>
      <form class="chat-input" id="chatForm"><input type="number" min="0.1" step="0.1" id="chatInput" placeholder="Ou digite um valor personalizado" required><button class="btn btn-primary" type="submit">Enviar</button></form>`;
    }
    if(st.step === "aplicacao"){
      return `<div class="chips">
        ${["Açougue","Distribuidora de laticínios","Indústria de bebidas","Farmácia / laboratório"].map(a=>`<button class="chip" data-action="chat-app" data-v="${esc(a)}">${a}</button>`).join("")}
      </div>
      <form class="chat-input" id="chatForm"><input id="chatInput" placeholder="Descreva a aplicação (ex: câmara para laticínios)" required><button class="btn btn-primary" type="submit">Enviar</button></form>`;
    }
    if(st.step === "done"){
      return `<div class="chat-input" style="justify-content:center;"><button class="btn btn-primary" data-action="ver-orcamento" data-id="${st.quoteId}">Ver orçamento completo →</button></div>`;
    }
    return "";
  }

  function calcEstimate(product, quantidade){
    const base = product.precoBase * quantidade;
    const aiAdjust = 1.04; // ajuste de complexidade estimado pela IA
    return Math.round(base * aiAdjust * 100) / 100;
  }

  function chatPushBotTyping(cb){
    chatState.log.push({who:"typing"});
    rerenderChat();
    setTimeout(()=>{
      chatState.log.pop();
      cb();
      rerenderChat();
    }, 650);
  }
  function rerenderChat(){
    const log = document.getElementById("chatLog");
    if(!log) return;
    log.innerHTML = chatState.log.map(m => m.who==="typing" ? `<div class="typing"><span></span><span></span><span></span></div>` : renderMsg(m)).join("");
    log.scrollTop = log.scrollHeight;
    const wrap = log.closest(".chat-window");
    const oldInput = wrap.querySelector(".chat-input, .chips");
    wrap.querySelectorAll(".chat-input, .chips").forEach(el=>el.remove());
    wrap.insertAdjacentHTML("beforeend", chatInputArea());
    bindChatInputs();
  }

  function bindChatInputs(){
    const form = document.getElementById("chatForm");
    if(form) form.addEventListener("submit", e => {
      e.preventDefault();
      const val = document.getElementById("chatInput").value.trim();
      if(!val) return;
      handleChatSubmit(val);
    });
  }

  function handleChatSubmit(val){
    if(chatState.step === "quantidade"){
      const n = parseFloat(String(val).replace(",","."));
      if(!n || n<=0){ return; }
      chatState.log.push({who:"user", text: `${n} ${chatState.product.unidade}${n>1?"s":""}`});
      chatState.quantidade = n;
      chatPushBotTyping(()=>{
        chatState.step = "aplicacao";
        chatState.log.push({who:"bot", text:"Perfeito. E para qual aplicação você vai usar este equipamento?"});
      });
    } else if(chatState.step === "aplicacao"){
      chatState.log.push({who:"user", text: val});
      if(val.length < 4){
        chatPushBotTyping(()=>{
          chatState.log.push({who:"bot", text:"Preciso de um pouco mais de detalhe sobre a aplicação para gerar uma estimativa precisa — pode descrever melhor o uso?"});
        });
        return;
      }
      chatState.aplicacao = val;
      chatPushBotTyping(()=>{
        chatState.log.push({who:"bot", text:"Ótimo, tenho dados suficientes. Calculando sua estimativa com base no catálogo e nas regras de precificação..."});
        chatPushBotTyping(()=>{
          const valor = calcEstimate(chatState.product, chatState.quantidade);
          const q = { id: uid("q"), numero: "ORC-" + String(db.seq.quote).padStart(4,"0"), clientId: currentUser().id,
            productId: chatState.product.id, quantidade: chatState.quantidade, aplicacao: chatState.aplicacao,
            valor, status:"pendente", createdAt: new Date().toISOString() };
          db.seq.quote++;
          db.quotes.push(q); saveDb(db);
          chatState.step = "done"; chatState.quoteId = q.id;
          chatState.log.push({who:"quote", html: `
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><b>Orçamento ${q.numero}</b><span class="badge badge-pending">Estimativa gerada</span></div>
            <div class="specs" style="margin-bottom:10px;">
              <div><span>Produto</span><b>${esc(chatState.product.nome)}</b></div>
              <div><span>Quantidade</span><b>${chatState.quantidade} ${esc(chatState.product.unidade)}${chatState.quantidade>1?"s":""}</b></div>
              <div><span>Aplicação</span><b>${esc(chatState.aplicacao)}</b></div>
            </div>
            <div class="price" style="font-size:1.2rem;">${brl(valor)}</div>
          ` });
        });
      });
    }
  }

  /* ===================== Views: Orçamento resumo / termos / pagamento ===================== */
  function getQuote(id){ return db.quotes.find(q=>q.id===id); }
  function getProduct(id){ return db.products.find(p=>p.id===id); }

  /* ---- Ficha técnica (preenchida pelo cliente, visível ao administrador junto do orçamento) ---- */

    abertura: {esquerda:"Esquerda", direita:"Direita"},
    revestimento: {aco_ral9003:"Aço RAL 9003", aco_inox:"Aço Inox"},
    nucleo: {eps:"EPS", pir:"PIR"},
    soleira: {com:"Com soleira", sem:"Sem soleira"},
    batente: {aberto:"Aberto", fechado:"Fechado"},
    aquecimento: {sem:"Sem aquecimento", simples:"Com aquecimento simples", duplo:"Com aquecimento duplo"},
    visor: {sem:"Sem visor", com:"Com visor"},
  };
  function fichaTecnicaDefaults(p){
    const isPorta = p && p.categoria === "Portas";
    return {
      x:"", y:"", b: isPorta ? "150" : "",
      localObra:"",
      abertura:"esquerda", revInterno:"aco_ral9003", revExterno:"aco_ral9003",

      concluida:false, concluidaVia:"",

  const FICHA_CONCLUIDA_LABEL = {chat:"chat", whatsapp:"WhatsApp"};
  function selectOptions(map, selected){
    return Object.entries(map).map(([v,l])=>`<option value="${v}" ${v===selected?"selected":""}>${esc(l)}</option>`).join("");
  }
  function fichaTecnicaFormHtml(q, p){
    const f = Object.assign(fichaTecnicaDefaults(p), q.fichaTecnica || {});
    const isPorta = p.categoria === "Portas";
    return `
      <form id="fichaTecnicaForm" data-id="${q.id}">
        <div class="ficha-section-title">Dimensões</div>
        <div class="ficha-grid">
          <div class="field" id="f_ft_x"><label for="ft_x">${isPorta?"Largura — X (mm)":"Largura (mm)"}</label><input type="number" id="ft_x" value="${esc(f.x)}" placeholder="Ex: 1520"><span class="error" hidden></span></div>
          <div class="field" id="f_ft_y"><label for="ft_y">${isPorta?"Altura — Y (mm)":"Altura / comprimento (mm)"}</label><input type="number" id="ft_y" value="${esc(f.y)}" placeholder="Ex: 2100"><span class="error" hidden></span></div>
          ${isPorta?`<div class="field" id="f_ft_b"><label for="ft_b">Espessura da folha — B (mm)</label><input type="number" id="ft_b" value="${esc(f.b)}" placeholder="Ex: 150"><span class="error" hidden></span></div>`:""}
          <div class="field" id="f_ft_localObra"><label for="ft_localObra">Local da obra</label><input type="text" id="ft_localObra" value="${esc(f.localObra)}" placeholder="Cidade - UF"><span class="error" hidden></span></div>
        </div>
        ${isPorta ? `
        <div class="ficha-section-title">Especificações da porta</div>
        <div class="ficha-grid">
          <div class="field"><label for="ft_abertura">Abertura</label><select id="ft_abertura">${selectOptions(FICHA_OPCOES.abertura, f.abertura)}</select></div>
          <div class="field"><label for="ft_revInterno">Revest. folha interno</label><select id="ft_revInterno">${selectOptions(FICHA_OPCOES.revestimento, f.revInterno)}</select></div>
          <div class="field"><label for="ft_revExterno">Revest. folha externo</label><select id="ft_revExterno">${selectOptions(FICHA_OPCOES.revestimento, f.revExterno)}</select></div>
          <div class="field"><label for="ft_nucleo">Núcleo isolante</label><select id="ft_nucleo">${selectOptions(FICHA_OPCOES.nucleo, f.nucleo)}</select></div>
          <div class="field"><label for="ft_soleira">Soleira</label><select id="ft_soleira">${selectOptions(FICHA_OPCOES.soleira, f.soleira)}</select></div>
          <div class="field"><label for="ft_batente">Batente</label><select id="ft_batente">${selectOptions(FICHA_OPCOES.batente, f.batente)}</select></div>
          <div class="field"><label for="ft_aquecimento">Aquecimento</label><select id="ft_aquecimento">${selectOptions(FICHA_OPCOES.aquecimento, f.aquecimento)}</select></div>
          <div class="field"><label for="ft_visor">Visor</label><select id="ft_visor">${selectOptions(FICHA_OPCOES.visor, f.visor)}</select></div>

        <div class="field" style="margin-top:4px;">
          <label>Proteção em chapa de alumínio xadrez</label>

          <label class="checkbox-row"><input type="checkbox" id="ft_protecaoInterna" ${f.protecaoInterna?"checked":""}><span>Interna</span></label>
        </div>` : ""}
        <div class="ficha-section-title">Informações adicionais</div>
        <div class="field" id="f_ft_informacoes">
          <label for="ft_informacoes">Observações para a equipe técnica — opcional (medidas específicas, prazos, condições do local, etc.)</label>
          <textarea id="ft_informacoes" rows="4" placeholder="Escreva aqui qualquer informação extra para a ficha técnica...">${esc(f.informacoes)}</textarea>
          <span class="error" hidden></span>
        </div>
        <button type="submit" class="btn btn-primary">Salvar ficha técnica</button>
      </form>
      <div class="ficha-section-title">Finalizar ficha técnica</div>
      ${f.concluida ? `<p class="hint" style="margin-bottom:10px;">✓ Ficha técnica finalizada pelo ${FICHA_CONCLUIDA_LABEL[f.concluidaVia]||f.concluidaVia}. A aprovação do orçamento já está liberada abaixo.</p>` : `<p class="hint" style="margin-bottom:10px;">Depois de salvar os dados acima, finalize por um dos canais abaixo para liberar a aprovação do orçamento.</p>`}

  function fichaTecnicaViewHtml(q, p){
    const f = q.fichaTecnica;

    const isPorta = p.categoria === "Portas";
    const rows = [
      [isPorta?"Largura (X)":"Largura", f.x ? f.x+" mm" : "—"],
      [isPorta?"Altura (Y)":"Altura/comprimento", f.y ? f.y+" mm" : "—"],
    ];
    if(isPorta) rows.push(["Espessura da folha (B)", f.b ? f.b+" mm" : "—"]);
    rows.push(["Local da obra", f.localObra || "—"]);
    if(isPorta){
      rows.push(
        ["Abertura", FICHA_OPCOES.abertura[f.abertura] || "—"],
        ["Revest. folha interno", FICHA_OPCOES.revestimento[f.revInterno] || "—"],
        ["Revest. folha externo", FICHA_OPCOES.revestimento[f.revExterno] || "—"],
        ["Núcleo isolante", FICHA_OPCOES.nucleo[f.nucleo] || "—"],
        ["Soleira", FICHA_OPCOES.soleira[f.soleira] || "—"],
        ["Batente", FICHA_OPCOES.batente[f.batente] || "—"],
        ["Aquecimento", FICHA_OPCOES.aquecimento[f.aquecimento] || "—"],
        ["Visor", FICHA_OPCOES.visor[f.visor] || "—"],
        ["Proteção alumínio xadrez", [f.protecaoExterna&&"Externa", f.protecaoInterna&&"Interna"].filter(Boolean).join(" + ") || "Nenhuma"],
      );

    return `
      <div class="ficha-view">
        <dl>${rows.map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(String(v))}</dd></div>`).join("")}</dl>

        </div>
        <p class="hint" style="margin-top:14px;">${f.concluida ? `✓ Ficha técnica finalizada pelo cliente via ${FICHA_CONCLUIDA_LABEL[f.concluidaVia]||f.concluidaVia}.` : "Cliente ainda não finalizou a ficha técnica."}</p>
      </div>
    `;
  }

      ${threadChatHtml(q, isAdmin, "orcamento", "Conversa sobre o orçamento", "Tire dúvidas com a nossa equipe sobre esta estimativa.")}
    `;
  }

  function viewPedidoDetalhe(id){
    const o = db.orders.find(x=>x.id===id);
    if(!o) return emptyState("Pedido não encontrado.", "#/meus-pedidos", "Ver meus pedidos");
    const me = currentUser();
    const isAdmin = me && me.role === "admin";
    if(!isAdmin && (!me || o.clientId !== me.id)){
      return emptyState("Você não tem acesso a este pedido.", "#/meus-pedidos", "Ver meus pedidos");
    }
    const q = getQuote(o.quoteId); const p = q ? getProduct(q.productId) : null;
    const idx = orderStatusIndex(o.status);
    const cliente = db.users.find(u=>u.id===o.clientId);
    return `
      <div class="page-head"><div><span class="eyebrow">Pedido ${esc(o.numero)}</span><h1>Acompanhamento</h1>${isAdmin?`<p>Cliente: ${esc(cliente?cliente.nome:"—")} · ${esc(cliente?cliente.email:"")}</p>`:""}</div></div>
      <div class="card pad">
        <div class="stepper">
          ${ORDER_STEPS.map((s,i)=>`<div class="step ${i<idx?'done':i===idx?'current':''}"><div class="dot">${i<idx?'✓':i+1}</div><div class="label">${s.label}</div></div>`).join("")}
        </div>
        ${p?`<div class="summary-row"><span>${esc(p.nome)}</span><span>${brl(o.valor)}</span></div>`:""}
        <div class="summary-row"><span>Pedido realizado em</span><span>${fmtDate(o.createdAt)}</span></div>
        ${o.previsaoEntrega && o.status!=="entregue" ? `<div class="summary-row"><span>Previsão de entrega</span><span>${fmtDateOnly(o.previsaoEntrega)}</span></div>` : ""}
        ${o.status==="entregue" ? `<div class="summary-row"><span>Entregue</span><span>${fmtDateOnly(o.previsaoEntrega || o.createdAt)}</span></div>` : ""}
      </div>
      ${threadChatHtml(o, isAdmin, "pedido", "Conversa sobre o pedido", "Tire dúvidas com a nossa equipe sobre este pedido específico.")}
    `;
  }

  function threadChatHtml(entity, isAdmin, tipo, titulo, subtitulo){
    return `
      <div class="card" style="margin-top:20px;overflow:hidden;">
        <div style="padding:18px 20px 6px;">
          <h3>${esc(titulo)}</h3>
          <p style="color:var(--text-2);font-size:.83rem;margin-top:2px;">${isAdmin ? "Fale diretamente com o cliente sobre este assunto." : esc(subtitulo)}</p>
        </div>
        <div class="chat-log" id="threadChatLog" style="height:260px;">
          ${renderThreadChatMessages(entity, isAdmin)}
        </div>
        <div class="chat-attach-preview" id="threadChatPreview" hidden></div>
        <form class="chat-input" id="threadChatForm" data-type="${tipo}" data-id="${entity.id}">
          <label class="chat-attach-btn" title="Anexar arquivo (foto, PDF, documento...)" aria-label="Anexar arquivo">+<input type="file" id="threadChatFile" hidden></label>
          <input type="hidden" id="threadChatImage">
          <input type="hidden" id="threadChatFileName">
          <input type="hidden" id="threadChatFileType">
          <input id="threadChatInput" placeholder="${isAdmin ? "Responder ao cliente..." : "Escreva sua mensagem..."}">
          <button class="btn btn-primary" type="submit">Enviar</button>
        </form>
      </div>
    `;
  }

  function renderThreadChatMessages(o, isAdmin){
    const chat = o.chat || [];
    if(!chat.length) return `<p style="color:var(--text-2);font-size:.85rem;padding:14px 4px;">Nenhuma mensagem ainda.</p>`;
    return chat.map(m=>{
      const mine = isAdmin ? m.from === "admin" : m.from === "cliente";
      const label = m.from === "admin" ? "Equipe FrigLab" : "Cliente";
      const img = m.imagem ? `<img src="${m.imagem}" alt="Foto enviada na conversa" data-action="ver-foto-chat">` : "";
      const arq = m.arquivo ? `<a class="file-link" href="${m.arquivo.data}" download="${esc(m.arquivo.nome)}">📎 ${esc(m.arquivo.nome)}</a>` : "";
      const texto = m.texto ? esc(m.texto) : "";
      return `<div class="msg ${mine?'msg-user':'msg-bot'}">${!mine?`<b style="display:block;font-size:.7rem;opacity:.75;margin-bottom:3px;">${label}</b>`:""}${texto}${img}${arq}</div>`;
    }).join("");
  }

  function emptyState(msg, href, label){
    return `<div class="empty-state"><div class="glyph">📦</div><p>${esc(msg)}</p><div style="margin-top:16px;"><button class="btn btn-secondary" data-nav="${href}">${esc(label)}</button></div></div>`;
  }

      </button>
      <div class="a11y-panel" id="a11yPanel" ${a11yOpen?"":"hidden"} role="dialog" aria-label="Painel de acessibilidade">
        <h4>Acessibilidade <button class="icon-btn" style="width:26px;height:26px;font-size:.8rem;" id="a11yClose" aria-label="Fechar">✕</button></h4>
        <div class="a11y-row"><span>Tamanho da fonte</span>
          <div class="fontsize-group">
            <button data-fs="0.9" class="${a11y.fontScale===0.9?'active':''}">A-</button>
            <button data-fs="1" class="${a11y.fontScale===1?'active':''}">A</button>
            <button data-fs="1.2" class="${a11y.fontScale===1.2?'active':''}">A+</button>
          </div>
        </div>
        <div class="a11y-row"><span>Alto contraste</span>
          <label class="switch"><input type="checkbox" id="chkContraste" ${a11y.highContrast?"checked":""}><span class="track"><span class="knob"></span></span></label>
        </div>
        <div class="a11y-row"><span>Reduzir animações</span>
          <label class="switch"><input type="checkbox" id="chkMotion" ${a11y.reduceMotion?"checked":""}><span class="track"><span class="knob"></span></span></label>
        </div>
      </div>
    `;
  }
  function initA11yWidget(){
    const wa = document.getElementById("whatsappFab");
    if(wa) wa.addEventListener("click", ()=>{ showToast("Em breve: fale com um vendedor direto pelo WhatsApp."); });
    const fab = document.getElementById("a11yFab");
    const panel = document.getElementById("a11yPanel");
    fab.addEventListener("click", ()=>{ a11yOpen = !a11yOpen; panel.hidden = !a11yOpen; fab.setAttribute("aria-expanded", a11yOpen); });
    document.getElementById("a11yClose").addEventListener("click", ()=>{ a11yOpen=false; panel.hidden=true; fab.setAttribute("aria-expanded","false"); });
    panel.querySelectorAll("[data-fs]").forEach(b=>b.addEventListener("click", ()=>{ a11y.fontScale = parseFloat(b.dataset.fs); saveA11y(); render(); a11yOpen=true; }));
    document.getElementById("chkContraste").addEventListener("change", e=>{ a11y.highContrast = e.target.checked; saveA11y(); });
    document.getElementById("chkMotion").addEventListener("change", e=>{ a11y.reduceMotion = e.target.checked; saveA11y(); });
  }

  /* ===================== Global event delegation ===================== */
  document.addEventListener("keydown", function(e){
    if(e.key !== "Enter" && e.key !== " ") return;
    const nav = e.target.closest && e.target.closest("[data-nav][tabindex]");
    if(nav){ e.preventDefault(); go(nav.dataset.nav); }
  });

  document.addEventListener("click", function(e){
    const nav = e.target.closest("[data-nav]");
    if(nav){ go(nav.dataset.nav); return; }

    const action = e.target.closest("[data-action]");
    if(!action) return;
    const act = action.dataset.action;

    if(act === "logout"){ setSession(null); chatState=null; pendingQuoteProductId=null; go("#/"); showToast("Sessão encerrada."); return; }

    if(act === "switch-role"){
      const me = currentUser();
      const targetId = me.role === "admin" ? "u_demo_cliente" : "u_admin";
      setSession({userId: targetId});
      chatState = null;
      const target = db.users.find(u=>u.id===targetId);
      go(target.role === "admin" ? "#/admin/catalogo" : "#/catalogo");
      showToast("Agora vendo como " + (target.role==="admin" ? "Administrador" : "Cliente") + ".");
      return;
    }

    if(act === "pedir-orcamento"){
      if(!currentUser()){
        pendingQuoteProductId = action.dataset.id;
        showToast("Crie uma conta ou entre para solicitar seu orçamento.");
        go("#/login");
        return;
      }
      chatState=null; go("#/orcamento/chat?produto="+action.dataset.id); return;
    }
    if(act === "ver-orcamento"){ go("#/orcamento/"+action.dataset.id); return; }

    if(act === "finalizar-ficha"){
      const q = getQuote(action.dataset.id);
      const via = action.dataset.via;
      const me = currentUser();
      if(!q || !me || q.clientId !== me.id) return;
      if(!q.fichaTecnica){ showToast("Preencha e salve a ficha técnica antes de finalizar."); return; }
      q.fichaTecnica.concluida = true;
      q.fichaTecnica.concluidaVia = via;
      q.chat = q.chat || [];
      q.chat.push({from:"cliente", texto: via==="whatsapp" ? "Ficha técnica preenchida e finalizada pelo WhatsApp. Aguardo a aprovação do orçamento." : "Ficha técnica preenchida e finalizada pelo chat. Aguardo a aprovação do orçamento.", ts:new Date().toISOString()});
      saveDb(db);
      showToast(via==="whatsapp" ? "Ficha técnica finalizada pelo WhatsApp." : "Ficha técnica finalizada pelo chat.");
      render();
      return;
    }
    if(act === "aprovar-orcamento"){
      const q = getQuote(action.dataset.id); q.status="aprovado_cliente"; saveDb(db); render(); showToast("Orçamento aprovado. Vamos para o pagamento.");
      return;
    }
    if(act === "recusar-orcamento"){
      const q = getQuote(action.dataset.id); q.status="encaminhado_representante"; saveDb(db); render(); showToast("Encaminhado para um representante regional.");
      return;
    }
    if(act === "atender-orcamento"){
      const q = getQuote(action.dataset.id); q.status="atendido_representante"; saveDb(db); render();
      return;
    }
    if(act === "avancar-pedido"){
      const o = db.orders.find(x=>x.id===action.dataset.id); const idx = orderStatusIndex(o.status);
      if(idx < ORDER_STEPS.length-1){ o.status = ORDER_STEPS[idx+1].key; saveDb(db); render(); }
      return;
    }

    if(act === "novo-produto"){
      document.getElementById("produtoFormWrap").innerHTML = productForm(null);
      return;
    }
    if(act === "editar-produto"){
      document.getElementById("produtoFormWrap").innerHTML = productForm(db.products.find(p=>p.id===action.dataset.id));
      return;
    }
    if(act === "cancelar-produto"){ document.getElementById("produtoFormWrap").innerHTML = ""; return; }
    if(act === "resetar-imagem-produto"){
      const formEl = document.getElementById("produtoForm");
      const pid = formEl ? formEl.dataset.id : "";
      const defaultArt = PRODUCT_ART[pid] || genericArt();
      document.getElementById("pf_imagem").value = defaultArt;
      document.getElementById("pf_imagem_preview").src = defaultArt;
      return;
    }
    if(act === "remover-produto"){
      db.products = db.products.filter(p=>p.id!==action.dataset.id); saveDb(db); render(); showToast("Produto removido.");
      return;
    }

    if(action.id === "userMenuBtn" || action.closest && action.closest("#userMenuBtn")){}
  });

  document.addEventListener("click", function(e){
    const btn = e.target.closest("#userMenuBtn");
    const menu = document.getElementById("userMenu");
    const notifBtn = e.target.closest("#notifBtn");
    const notifPanel = document.getElementById("notifPanel");
    const searchBtn = e.target.closest("#searchBtn");
    const searchPanel = document.getElementById("searchPanel");
    if(!menu && !notifPanel && !searchPanel) return;

    function closeAllExcept(keep){
      if(menu && keep!=="menu"){ menu.hidden = true; const b=document.getElementById("userMenuBtn"); if(b) b.setAttribute("aria-expanded","false"); }
      if(notifPanel && keep!=="notif"){ notifPanel.hidden = true; const b=document.getElementById("notifBtn"); if(b) b.setAttribute("aria-expanded","false"); }
      if(searchPanel && keep!=="search"){ searchPanel.hidden = true; const b=document.getElementById("searchBtn"); if(b) b.setAttribute("aria-expanded","false"); }
    }

    if(btn && menu){
      const willOpen = menu.hidden;
      closeAllExcept(willOpen ? "menu" : null);
      menu.hidden = !willOpen; btn.setAttribute("aria-expanded", willOpen);
      return;
    }
    if(notifBtn && notifPanel){
      const willOpen = notifPanel.hidden;
      closeAllExcept(willOpen ? "notif" : null);
      notifPanel.hidden = !willOpen; notifBtn.setAttribute("aria-expanded", willOpen);
      return;
    }
    if(searchBtn && searchPanel){
      const willOpen = searchPanel.hidden;
      closeAllExcept(willOpen ? "search" : null);
      searchPanel.hidden = !willOpen; searchBtn.setAttribute("aria-expanded", willOpen);
      if(willOpen) setTimeout(()=>{ const i=document.getElementById("searchInput"); if(i) i.focus(); }, 0);
      return;
    }
    if(menu && !e.target.closest("#userMenu")) menu.hidden = true;
    if(notifPanel && !e.target.closest("#notifPanel")) notifPanel.hidden = true;
    if(searchPanel && !e.target.closest("#searchPanel")) searchPanel.hidden = true;
  });

  document.addEventListener("click", function(e){
    if(e.target.closest("[data-action='chat-qtd']")){ handleChatSubmit(e.target.dataset.v); }
    if(e.target.closest("[data-action='chat-app']")){ handleChatSubmit(e.target.dataset.v); }
    if(e.target.id === "threadChatRemoveImg"){
      clearChatAttachment();
    }
  });

  document.addEventListener("change", function(e){
    if(e.target.id === "pf_imagem_file"){
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      if(!file.type.startsWith("image/")){ showToast("Selecione um arquivo de imagem."); return; }
      resizeImageFile(file, 900, function(dataUrl){
        document.getElementById("pf_imagem").value = dataUrl;
        document.getElementById("pf_imagem_preview").src = dataUrl;
      });
    }
    if(e.target.id === "threadChatFile"){
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      const prev = document.getElementById("threadChatPreview");
      const setAttachment = function(dataUrl, name, type, previewHtml){
        document.getElementById("threadChatImage").value = dataUrl;
        document.getElementById("threadChatFileName").value = name;
        document.getElementById("threadChatFileType").value = type;
        prev.hidden = false;
        prev.innerHTML = previewHtml + `<button type="button" id="threadChatRemoveImg" aria-label="Remover anexo">✕</button>`;
      };
      if(file.type.startsWith("image/")){
        resizeImageFile(file, 700, function(dataUrl){
          setAttachment(dataUrl, file.name, "image", `<img src="${dataUrl}" alt=""><span>${esc(file.name)}</span>`);
        });
      } else {
        if(file.size > CHAT_FILE_MAX){ showToast("Arquivo grande demais (máx. 1,5 MB)."); e.target.value = ""; return; }
        const reader = new FileReader();
        reader.onload = function(ev){
          setAttachment(ev.target.result, file.name, file.type || "application/octet-stream", `<span class="file-chip">📎 ${esc(file.name)} <small>(${fmtBytes(file.size)})</small></span>`);
        };
        reader.onerror = function(){ showToast("Não foi possível ler esse arquivo."); };
        reader.readAsDataURL(file);
      }
    }
  });

  document.addEventListener("submit", function(e){
    if(e.target.id === "searchForm"){
      e.preventDefault();
      const target = e.target.dataset.target;
      const val = document.getElementById("searchInput").value.trim();
      go(target + (val ? "?q=" + encodeURIComponent(val) : ""));
      return;
    }
    if(e.target.id === "dateFilterForm"){
      e.preventDefault();
      const base = e.target.dataset.base;
      const de = document.getElementById("dfDe").value;
      const ate = document.getElementById("dfAte").value;
      const ord = document.getElementById("dfOrd").value;
      const params = [];
      if(de) params.push("de=" + de);
      if(ate) params.push("ate=" + ate);
      if(ord === "asc") params.push("ord=asc");
      go(base + (params.length ? "?" + params.join("&") : ""));
      return;
    }
    if(e.target.id === "loginForm"){
      e.preventDefault();
      clearErrors(e.target);
      const email = document.getElementById("in_email").value.trim();
      const senha = document.getElementById("in_senha").value;
      let ok = true;
      if(!email){ fieldError("f_email","Informe seu e-mail."); ok=false; }
      if(!senha){ fieldError("f_senha","Informe sua senha."); ok=false; }
      if(!ok) return;
      const user = db.users.find(u=>u.email.toLowerCase()===email.toLowerCase());
      if(!user || user.senha !== senha){ fieldError("f_senha","E-mail ou senha inválidos."); return; }
      setSession({userId:user.id});
      goAfterLogin(user);
      showToast("Bem-vindo(a), "+user.nome.split(" ")[0]+"!");
    }

    if(e.target.id === "cadastroForm"){
      e.preventDefault();
      clearErrors(e.target);
      const nome = document.getElementById("in_nome").value.trim();
      const email = document.getElementById("in_email").value.trim();
      const senha = document.getElementById("in_senha").value;
      const senha2 = document.getElementById("in_senha2").value;
      let ok = true;
      if(!nome){ fieldError("f_nome","Informe seu nome."); ok=false; }
      if(!email || !/^\S+@\S+\.\S+$/.test(email)){ fieldError("f_email","Informe um e-mail válido."); ok=false; }
      else if(db.users.some(u=>u.email.toLowerCase()===email.toLowerCase())){ fieldError("f_email","Já existe uma conta com este e-mail."); ok=false; }
      if(!senha || senha.length<6){ fieldError("f_senha","A senha deve ter ao menos 6 caracteres."); ok=false; }
      if(senha !== senha2){ fieldError("f_senha2","As senhas não coincidem."); ok=false; }
      const aceitouTermos = document.getElementById("chkTermosCadastro").checked;
      if(!aceitouTermos){ fieldError("f_termos","É necessário aceitar os Termos de Uso e a Política de Privacidade."); ok=false; }
      if(!ok) return;
      const user = {id:uid("u"), nome, email, senha, role:"cliente", termosAceitos:true, termosAceitosEm:new Date().toISOString()};
      db.users.push(user); saveDb(db);
      setSession({userId:user.id});
      sessionTermsAck = true;
      goAfterLogin(user);
      showToast("Conta criada com sucesso!");
    }

    if(e.target.id === "aceiteTermosForm"){
      e.preventDefault();
      clearErrors(e.target);
      const chk = document.getElementById("chkTermosLogin").checked;
      if(!chk){ fieldError("f_termos_login","É necessário aceitar os Termos de Uso e a Política de Privacidade para continuar."); return; }
      const user = currentUser();
      user.termosAceitos = true; user.termosAceitosEm = new Date().toISOString();
      saveDb(db);
      sessionTermsAck = true;
      goAfterLogin(user);
    }

    if(e.target.id === "produtoForm"){
      e.preventDefault();
      const id = e.target.dataset.id;
      const data = {
        nome: document.getElementById("pf_nome").value.trim(),
        sku: document.getElementById("pf_sku").value.trim(),
        categoria: document.getElementById("pf_categoria").value.trim(),
        precoBase: parseFloat(document.getElementById("pf_preco").value)||0,
        unidade: document.getElementById("pf_unidade").value.trim()||"unidade",
        faixaTemp: document.getElementById("pf_temp").value.trim(),
        capacidade: document.getElementById("pf_capacidade").value.trim(),
        dimensoesRef: document.getElementById("pf_dim").value.trim(),
        descricao: document.getElementById("pf_desc").value.trim(),
        imagem: document.getElementById("pf_imagem").value || genericArt()
      };
      const previous = id ? JSON.parse(JSON.stringify(db.products.find(p=>p.id===id))) : null;
      if(id){ Object.assign(db.products.find(p=>p.id===id), data); }
      else { db.products.push(Object.assign({id:uid("p")}, data)); }
      const ok = saveDb(db);
      if(!ok){
        if(previous){ Object.assign(db.products.find(p=>p.id===id), previous); } else { db.products.pop(); }
        showToast("A imagem é grande demais para salvar. Tente uma foto menor.");
      } else {
        showToast(id ? "Produto atualizado." : "Produto criado.");
      }
      render();
    }

    if(e.target.id === "fichaTecnicaForm"){
      e.preventDefault();
      const q = getQuote(e.target.dataset.id);
      const me = currentUser();
      if(!q || !me || q.clientId !== me.id) return;
      const p = getProduct(q.productId);
      const isPorta = p.categoria === "Portas";
      clearErrors(e.target);
      let ok = true;
      const vx = document.getElementById("ft_x").value.trim();
      const vy = document.getElementById("ft_y").value.trim();
      const vLocal = document.getElementById("ft_localObra").value.trim();
      const vInfo = document.getElementById("ft_informacoes").value.trim();
      if(!vx){ fieldError("f_ft_x","Preencha este campo."); ok=false; }
      if(!vy){ fieldError("f_ft_y","Preencha este campo."); ok=false; }
      if(isPorta && !document.getElementById("ft_b").value.trim()){ fieldError("f_ft_b","Preencha este campo."); ok=false; }
      if(!vLocal){ fieldError("f_ft_localObra","Preencha este campo."); ok=false; }
      if(!ok){ showToast("Preencha todos os dados da ficha técnica corretamente."); return; }
      const ft = Object.assign(fichaTecnicaDefaults(p), q.fichaTecnica || {}, {
        x: vx,
        y: vy,
        localObra: vLocal,
        informacoes: vInfo,
      });
      if(isPorta){
        Object.assign(ft, {
          b: document.getElementById("ft_b").value.trim(),
          abertura: document.getElementById("ft_abertura").value,
          revInterno: document.getElementById("ft_revInterno").value,
          revExterno: document.getElementById("ft_revExterno").value,
          nucleo: document.getElementById("ft_nucleo").value,
          soleira: document.getElementById("ft_soleira").value,
          batente: document.getElementById("ft_batente").value,
          aquecimento: document.getElementById("ft_aquecimento").value,
          visor: document.getElementById("ft_visor").value,
          protecaoExterna: document.getElementById("ft_protecaoExterna").checked,
          protecaoInterna: document.getElementById("ft_protecaoInterna").checked,
        });
      }
      q.fichaTecnica = ft;
      saveDb(db);
      showToast("Ficha técnica salva.");
      render();
    }

    if(e.target.id === "threadChatForm"){
      e.preventDefault();
      const entityType = e.target.dataset.type;
      const entityId = e.target.dataset.id;
      const entity = entityType === "orcamento" ? db.quotes.find(x=>x.id===entityId) : db.orders.find(x=>x.id===entityId);
      const me = currentUser();
      if(!entity || !me) return;
      const isAdmin = me.role === "admin";
      if(!isAdmin && entity.clientId !== me.id) return;
      const input = document.getElementById("threadChatInput");
      const imgInput = document.getElementById("threadChatImage");
      const texto = input.value.trim();
      const anexo = imgInput ? imgInput.value : "";
      const anexoNome = document.getElementById("threadChatFileName").value;
      const anexoTipo = document.getElementById("threadChatFileType").value;
      if(!texto && !anexo) return;
      entity.chat = entity.chat || [];
      const msg = {from: isAdmin ? "admin" : "cliente", texto, ts: new Date().toISOString()};
      if(anexo && anexoTipo === "image") msg.imagem = anexo;
      else if(anexo) msg.arquivo = {nome: anexoNome, tipo: anexoTipo, data: anexo};
      entity.chat.push(msg);
      const ok = saveDb(db);
      if(!ok){
        entity.chat.pop();
        showToast("O anexo é grande demais para salvar. Tente um arquivo menor.");
        return;
      }
      const log = document.getElementById("threadChatLog");
      log.innerHTML = renderThreadChatMessages(entity, isAdmin);
      log.scrollTop = log.scrollHeight;
      input.value = "";
      clearChatAttachment();
      input.focus();
    }

    if(e.target.id === "pagamentoForm"){
      e.preventDefault();
      clearErrors(e.target);
      const nome = document.getElementById("pg_nome").value.trim();
      const numero = document.getElementById("pg_numero").value.replace(/\s/g,"");
      const val = document.getElementById("pg_val").value.trim();
      const cvv = document.getElementById("pg_cvv").value.trim();
      let ok = true;
      if(!nome){ document.getElementById("pg_nome").focus(); ok=false; }
      if(!/^\d{13,19}$/.test(numero)){ document.getElementById("pg_numero").focus(); ok=false; }
      if(!/^\d{2}\/\d{2}$/.test(val)){ document.getElementById("pg_val").focus(); ok=false; }
      if(!/^\d{3,4}$/.test(cvv)){ document.getElementById("pg_cvv").focus(); ok=false; }
      if(!ok){ showToast("Confira os dados do cartão."); return; }

      const quoteId = location.hash.split("/").pop();
      const q = getQuote(quoteId);
      const btn = document.getElementById("btnPagar");
      btn.disabled = true; btn.textContent = "Processando pagamento...";
      setTimeout(()=>{
        q.status = "convertido";
        const prod = getProduct(q.productId);
        const createdAt = new Date().toISOString();
        const order = {id:uid("o"), numero:"FRIG-"+new Date().getFullYear()+"-"+String(db.seq.order).padStart(5,"0"),
          quoteId: q.id, clientId: q.clientId, valor: q.valor, status:"recebido", createdAt,
          previsaoEntrega: addDays(createdAt, prazoEntregaDias(prod && prod.categoria)), chat:[]};
        db.seq.order++; db.orders.push(order); saveDb(db);
        go("#/confirmacao/"+order.id);
      }, 900);
    }
  });

  function afterRender(path, parts){
    if(path === "orcamento" && parts[1] === "chat"){ bindChatInputs(); }
    if((path === "pedido" || path === "orcamento") && parts[1] && parts[1] !== "chat"){
      const log = document.getElementById("threadChatLog");
      if(log) log.scrollTop = log.scrollHeight;
      const entity = path === "orcamento" ? db.quotes.find(x=>x.id===parts[1]) : db.orders.find(x=>x.id===parts[1]);
      const me = currentUser();
      if(entity && me){
        const role = me.role === "admin" ? "admin" : "cliente";
        if(role === "admin" || entity.clientId === me.id) markThreadSeen(entity, role);
      }
    }
  }

})();
</script>
